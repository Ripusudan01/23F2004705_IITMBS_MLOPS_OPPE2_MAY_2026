name: CI/CD - Heart Disease API

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: mlops-course-497503
  REGION: asia-south1
  ARTIFACT_REPOSITORY: mlops-oppe2
  IMAGE_NAME: heart-disease-api
  GKE_CLUSTER: oppe2-cluster
  GKE_ZONE: asia-south1-a
  DEPLOYMENT_NAME: heart-disease-api

jobs:
  build-test-deploy:
    name: Build, Test, Push and Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python source
        run: |
          python -m compileall -q src
          echo "Python source validation passed."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA}"
          echo "Building ${IMAGE}"
          docker build -t "${IMAGE}" .

      - name: Push Docker image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA}"
          docker push "${IMAGE}"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Update deployment image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA}"
          kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} \
            heart-disease-api="${IMAGE}"

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} --timeout=180s

      - name: Verify deployment
        run: |
          echo "=== Deployment ==="
          kubectl get deployment ${{ env.DEPLOYMENT_NAME }} -o wide

          echo "=== Pods ==="
          kubectl get pods -l app=heart-disease-api -o wide

          echo "=== HPA ==="
          kubectl get hpa heart-disease-api

          echo "=== Services ==="
          kubectl get service heart-disease-api
